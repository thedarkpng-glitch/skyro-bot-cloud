name: Skyro Bot Cloud - Windows

on:
  workflow_dispatch:

jobs:
  panel:
    # IMPORTANTE:
    # windows-latest em repos privado pode ter limites/consumo.
    # Este workflow NÃO contorna cobrança do GitHub.
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      BOT_PANEL_PORT: 5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python, Node e VS Code
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[1/4] Python"
          py --version
          python --version

          Write-Host "[2/4] Node.js"
          node --version
          npm --version

          Write-Host "[3/4] VS Code"
          if (-not (Get-Command code -ErrorAction SilentlyContinue)) {
            winget install --id Microsoft.VisualStudioCode -e `
              --accept-package-agreements `
              --accept-source-agreements `
              --silent
          }

          Write-Host "[4/4] Dependências do painel"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Configurar Tailscale
        if: ${{ secrets.TAILSCALE_AUTH_KEY != '' }}
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Baixando Tailscale..."
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $msi

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale não foi instalado."
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "TAILSCALE_AUTH_KEY está vazio."
          }

          Write-Host "Entrando no Tailscale..."
          & $ts up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="skyro-panel-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale falhou. Gere uma Auth Key nova e atualize o Secret TAILSCALE_AUTH_KEY."
          }

          $ip = (& $ts ip -4 2>$null | Select-Object -First 1)

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Tailscale conectou, mas não retornou um IPv4."
          }

          "TAILSCALE_IP=$($ip.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host ""
          Write-Host "========================================"
          Write-Host " TAILSCALE"
          Write-Host "========================================"
          Write-Host "IP: $($ip.Trim())"
          Write-Host "========================================"

      - name: Configurar RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "[1/4] Habilitando RDP..."
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Write-Host "[2/4] Firewall..."
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "[3/4] Serviço..."
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue

          Write-Host "[4/4] RDP configurado."

      - name: Criar usuário do painel/RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Crie o GitHub Secret RDP_PASSWORD antes de executar."
          }

          $user = "Skyro"
          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue

          if ($existing) {
            Set-LocalUser -Name $user -Password $secure
          } else {
            New-LocalUser `
              -Name $user `
              -Password $secure `
              -PasswordNeverExpires `
              -UserMayNotChangePassword `
              -Description "Skyro Bot Cloud RDP"
          }

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue

          # Não adiciona Skyro ao grupo Administrators.
          Write-Host "Usuário RDP criado/atualizado: $user"

      - name: Iniciar Skyro Bot Cloud
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $python = (Get-Command python).Source
          $project = (Get-Location).Path
          $log = Join-Path $project "panel.log"

          Write-Host "Iniciando painel..."
          Write-Host "URL local: http://127.0.0.1:$env:BOT_PANEL_PORT"

          $p = Start-Process `
            -FilePath $python `
            -ArgumentList "app.py" `
            -WorkingDirectory $project `
            -RedirectStandardOutput $log `
            -RedirectStandardError $log `
            -PassThru

          Start-Sleep -Seconds 5

          if ($p.HasExited) {
            Get-Content $log -ErrorAction SilentlyContinue
            throw "O painel encerrou na inicialização."
          }

          Write-Host "Painel PID: $($p.Id)"

      - name: Informações de acesso
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "              SKYRO BOT CLOUD"
          Write-Host "=================================================="
          Write-Host "RDP:"
          if ($env:TAILSCALE_IP) {
            Write-Host "  $env:TAILSCALE_IP:3389"
          } else {
            Write-Host "  Tailscale não configurado."
          }
          Write-Host ""
          Write-Host "Usuário RDP: Skyro"
          Write-Host "Senha RDP: valor do Secret RDP_PASSWORD"
          Write-Host ""
          Write-Host "Painel:"
          Write-Host "  http://127.0.0.1:5000"
          Write-Host ""
          Write-Host "IMPORTANTE: não publique a porta 5000 na internet."
          Write-Host "=================================================="

      - name: Manter runner ativo
        shell: powershell
        run: |
          Write-Host "Runner ativo. Ctrl+C não é necessário."
          while ($true) {
            $panel = Get-Process python -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -eq (Get-Command python).Source }

            if (-not $panel) {
              Write-Host "O processo Python do painel não está mais ativo."
            }

            if ($env:TAILSCALE_IP) {
              Write-Host "$(Get-Date -Format 'HH:mm:ss') | RDP: $env:TAILSCALE_IP:3389"
            }

            Start-Sleep -Seconds 60
          }
