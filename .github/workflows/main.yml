name: Skyro Bot Cloud - Windows

on:
  workflow_dispatch:

jobs:
  panel:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      BOT_PANEL_PORT: 5000

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Baixar projeto
        uses: actions/checkout@v4


      # =========================================================
      # INSTALAR FERRAMENTAS
      # =========================================================

      - name: Instalar ferramentas
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " SKYRO BOT CLOUD"
          Write-Host " Instalando ferramentas..."
          Write-Host "=========================================="

          # -----------------------------------------------------
          # Git
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "[1/6] Git"

          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {

              winget install `
                --id Git.Git `
                -e `
                --accept-package-agreements `
                --accept-source-agreements `
                --silent
          }

          Write-Host "Git OK"


          # -----------------------------------------------------
          # Python
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "[2/6] Python"

          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {

              winget install `
                --id Python.Python.3.13 `
                -e `
                --accept-package-agreements `
                --accept-source-agreements `
                --silent
          }

          Write-Host "Python OK"


          # -----------------------------------------------------
          # Node.js
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "[3/6] Node.js"

          if (-not (Get-Command node -ErrorAction SilentlyContinue)) {

              winget install `
                --id OpenJS.NodeJS.LTS `
                -e `
                --accept-package-agreements `
                --accept-source-agreements `
                --silent
          }

          Write-Host "Node.js OK"


          # -----------------------------------------------------
          # VS Code
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "[4/6] Visual Studio Code"

          if (-not (Get-Command code -ErrorAction SilentlyContinue)) {

              winget install `
                --id Microsoft.VisualStudioCode `
                -e `
                --accept-package-agreements `
                --accept-source-agreements `
                --silent
          }

          Write-Host "VS Code OK"


          # -----------------------------------------------------
          # 7-Zip
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "[5/6] 7-Zip"

          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {

              winget install `
                --id 7zip.7zip `
                -e `
                --accept-package-agreements `
                --accept-source-agreements `
                --silent
          }

          Write-Host "7-Zip OK"


          # -----------------------------------------------------
          # Tailscale
          # -----------------------------------------------------

          Write-Host ""
          Write-Host "[6/6] Tailscale"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {

              $msi = "$env:TEMP\tailscale.msi"

              Invoke-WebRequest `
                -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
                -OutFile $msi

              Start-Process `
                msiexec.exe `
                -ArgumentList "/i `"$msi`" /qn /norestart" `
                -Wait
          }

          Write-Host "Tailscale OK"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " Ferramentas instaladas."
          Write-Host "=========================================="


      # =========================================================
      # ATUALIZAR PATH
      # =========================================================

      - name: Atualizar PATH
        shell: powershell
        run: |
          $paths = @(
            "$env:ProgramFiles\Tailscale",
            "$env:ProgramFiles\Git\cmd",
            "$env:ProgramFiles\nodejs",
            "$env:LOCALAPPDATA\Programs\Microsoft VS Code\bin"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $env:PATH = "$path;$env:PATH"
              Write-Host "PATH + $path"
            }
          }

          "PATH=$env:PATH" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append


      # =========================================================
      # VERIFICAR FERRAMENTAS
      # =========================================================

      - name: Verificar ferramentas
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " VERSÕES"
          Write-Host "=========================================="

          git --version
          python --version
          pip --version
          node --version
          npm --version
          code --version
          7z
          
          Write-Host ""
          Write-Host "Ferramentas verificadas."


      # =========================================================
      # PYTHON DEPENDÊNCIAS
      # =========================================================

      - name: Instalar dependências Python
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {

              Write-Host "Instalando requirements.txt..."

              python -m pip install `
                -r requirements.txt

          } else {

              Write-Host "requirements.txt não encontrado."
              Write-Host "Nenhuma dependência adicional instalada."
          }


      # =========================================================
      # TAILSCALE
      # =========================================================

      - name: Configurar Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |

          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {

              Write-Host ""
              Write-Host "TAILSCALE_AUTH_KEY não configurado."
              Write-Host "Tailscale será ignorado."

              exit 0
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
              throw "Tailscale não foi encontrado."
          }

          Write-Host ""
          Write-Host "Conectando ao Tailscale..."

          & $ts up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="skyro-panel-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Falha ao conectar no Tailscale."
          }

          Start-Sleep -Seconds 5

          $ip = & $ts ip -4 2>$null |
            Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($ip)) {
              throw "Tailscale não retornou um IP."
          }

          $ip = $ip.Trim()

          "TAILSCALE_IP=$ip" |
            Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " TAILSCALE CONECTADO"
          Write-Host "=========================================="
          Write-Host "IP: $ip"
          Write-Host "=========================================="


      # =========================================================
      # RDP
      # =========================================================

      - name: Configurar RDP
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          Write-Host "[1/4] Ativando RDP..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0


          Write-Host "[2/4] Firewall..."

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"


          Write-Host "[3/4] Serviço RDP..."

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Start-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue


          Write-Host "[4/4] RDP configurado."


      # =========================================================
      # USUÁRIO RDP
      # =========================================================

      - name: Criar usuário Skyro
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {

              throw "O Secret RDP_PASSWORD não foi configurado."
          }

          $username = "Skyro"

          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force


          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue


          if ($existing) {

              Write-Host "Usuário já existe."

              Set-LocalUser `
                -Name $username `
                -Password $password

          } else {

              Write-Host "Criando usuário..."

              New-LocalUser `
                -Name $username `
                -Password $password `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -Description "Skyro Bot Cloud RDP"
          }


          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue


          Write-Host ""
          Write-Host "Usuário RDP: Skyro"


      # =========================================================
      # CONFIGURAR PAINEL
      # =========================================================

      - name: Verificar painel
        shell: powershell
        run: |

          if (-not (Test-Path "app.py")) {

              Write-Host ""
              Write-Host "AVISO:"
              Write-Host "app.py não foi encontrado."
              Write-Host "O runner continuará ativo."

          } else {

              Write-Host "app.py encontrado."
          }


      # =========================================================
      # INICIAR PAINEL
      # =========================================================

      - name: Iniciar Skyro Bot Cloud
        shell: powershell
        run: |

          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "app.py")) {

              Write-Host "app.py não existe."
              Write-Host "Pulando inicialização do painel."

              exit 0
          }


          $python = (Get-Command python).Source

          $project = (Get-Location).Path

          $log = Join-Path `
            $project `
            "panel.log"


          Write-Host ""
          Write-Host "=========================================="
          Write-Host " INICIANDO SKYRO BOT CLOUD"
          Write-Host "=========================================="

          Write-Host "Python: $python"

          Write-Host "Porta: $env:BOT_PANEL_PORT"


          $p = Start-Process `
            -FilePath $python `
            -ArgumentList "app.py" `
            -WorkingDirectory $project `
            -RedirectStandardOutput $log `
            -RedirectStandardError $log `
            -PassThru


          Start-Sleep -Seconds 5


          if ($p.HasExited) {

              Write-Host ""
              Write-Host "LOG DO PAINEL:"
              Write-Host "------------------------------------------"

              Get-Content `
                $log `
                -ErrorAction SilentlyContinue

              throw "O painel encerrou."
          }


          Write-Host ""
          Write-Host "Painel iniciado."
          Write-Host "PID: $($p.Id)"
          Write-Host "Porta: $env:BOT_PANEL_PORT"


      # =========================================================
      # INFORMAÇÕES
      # =========================================================

      - name: Mostrar acesso
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "              SKYRO BOT CLOUD"
          Write-Host "=================================================="

          Write-Host ""

          if ($env:TAILSCALE_IP) {

              Write-Host "RDP:"
              Write-Host "$env:TAILSCALE_IP`:3389"

          } else {

              Write-Host "RDP:"
              Write-Host "Tailscale não configurado."
          }


          Write-Host ""
          Write-Host "Usuário: Skyro"
          Write-Host "Senha: Secret RDP_PASSWORD"

          Write-Host ""

          Write-Host "Painel local:"
          Write-Host "http://127.0.0.1:5000"

          Write-Host ""

          Write-Host "=================================================="


      # =========================================================
      # MANTER RUNNER
      # =========================================================

      - name: Manter máquina ativa
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " SKYRO BOT CLOUD ATIVO"
          Write-Host "=========================================="

          while ($true) {

              $pythonPath = (Get-Command python).Source

              $panel = Get-Process python `
                -ErrorAction SilentlyContinue |
                Where-Object {
                    $_.Path -eq $pythonPath
                }


              if ($panel) {

                  Write-Host `
                    "$(Get-Date -Format 'HH:mm:ss') | Painel: ONLINE"

              } else {

                  Write-Host `
                    "$(Get-Date -Format 'HH:mm:ss') | Painel: OFFLINE"
              }


              if ($env:TAILSCALE_IP) {

                  Write-Host `
                    "$(Get-Date -Format 'HH:mm:ss') | RDP: $env:TAILSCALE_IP`:3389"
              }


              Start-Sleep -Seconds 60
          }
