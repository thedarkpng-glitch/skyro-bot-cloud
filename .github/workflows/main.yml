name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    name: RDP Windows
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CONFIGURAÇÃO DO WINDOWS
      # ============================================================

      - name: "01 - Configurar Windows"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "              WINDOWS RDP - CONFIGURACAO"
          Write-Host "============================================================"
          Write-Host ""

          $Username = "RDPUser"
          $PasswordText = "Rdp@2026!Windows"

          Write-Host "[1/6] Verificando usuario..."

          $User = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue

          if ($User) {
              Write-Host "[INFO] Usuario existente encontrado."
              Write-Host "[INFO] Removendo usuario antigo..."

              Remove-LocalUser -Name $Username

              Write-Host "[OK] Usuario antigo removido."
          }
          else {
              Write-Host "[INFO] Usuario ainda nao existe."
          }

          Write-Host ""
          Write-Host "[2/6] Criando senha segura..."

          $SecurePassword = ConvertTo-SecureString `
              $PasswordText `
              -AsPlainText `
              -Force

          Write-Host "[OK] Senha preparada."

          Write-Host ""
          Write-Host "[3/6] Criando usuario..."

          New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -FullName "RDP User" `
              -Description "Usuario para acesso remoto RDP" `
              -PasswordNeverExpires `
              -AccountNeverExpires

          Write-Host "[OK] Usuario criado."

          Write-Host ""
          Write-Host "[4/6] Adicionando usuario aos Administrators..."

          $AdminGroup = Get-LocalGroup -SID "S-1-5-32-544"

          Add-LocalGroupMember `
              -SID $AdminGroup.SID `
              -Member $Username

          Write-Host "[OK] Usuario adicionado aos administradores."

          Write-Host ""
          Write-Host "[5/6] Ativando conexoes RDP..."

          Set-ItemProperty `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
              -Name "fDenyTSConnections" `
              -Value 0

          Write-Host "[OK] RDP ativado."

          Write-Host ""
          Write-Host "[6/6] Configurando Firewall..."

          Enable-NetFirewallRule `
              -DisplayGroup "Remote Desktop" `
              -ErrorAction SilentlyContinue

          Write-Host "[OK] Firewall configurado."

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "              WINDOWS CONFIGURADO"
          Write-Host "============================================================"
          Write-Host " Usuario : $Username"
          Write-Host " Senha   : $PasswordText"
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 2. SERVICO RDP
      # ============================================================

      - name: "02 - Iniciar servico RDP"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 SERVICO RDP"
          Write-Host "============================================================"

          Write-Host "[INFO] Configurando TermService..."

          Set-Service `
              -Name "TermService" `
              -StartupType Automatic

          Start-Service `
              -Name "TermService" `
              -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3

          $Service = Get-Service -Name "TermService"

          if ($Service.Status -ne "Running") {
              throw "O servico TermService nao iniciou."
          }

          Write-Host "[OK] TermService esta em execucao."

          Write-Host ""
          Write-Host "============================================================"

      # ============================================================
      # 3. BAIXAR TAILSCALE
      # ============================================================

      - name: "03 - Instalar Tailscale"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 TAILSCALE"
          Write-Host "============================================================"

          $Installer = "$env:TEMP\tailscale-setup.exe"

          Write-Host "[INFO] Baixando Tailscale..."

          Invoke-WebRequest `
              -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
              -OutFile $Installer

          if (!(Test-Path $Installer)) {
              throw "O instalador do Tailscale nao foi baixado."
          }

          Write-Host "[OK] Download concluido."

          Write-Host "[INFO] Instalando Tailscale..."

          $Process = Start-Process `
              -FilePath $Installer `
              -ArgumentList "/quiet" `
              -Wait `
              -PassThru

          if ($Process.ExitCode -ne 0) {
              throw "Instalacao do Tailscale falhou. Codigo: $($Process.ExitCode)"
          }

          Write-Host "[OK] Tailscale instalado."

          Write-Host ""
          Write-Host "============================================================"

      # ============================================================
      # 4. CONECTAR TAILSCALE
      # ============================================================

      - name: "04 - Conectar Tailscale"
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "              CONEXAO TAILSCALE"
          Write-Host "============================================================"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "O Secret TAILSCALE_AUTH_KEY nao foi configurado."
          }

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $Tailscale)) {
              $Tailscale = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          }

          if (!(Test-Path $Tailscale)) {
              throw "tailscale.exe nao foi encontrado."
          }

          Write-Host "[OK] Executavel encontrado:"
          Write-Host "     $Tailscale"

          Write-Host ""
          Write-Host "[INFO] Conectando a rede Tailscale..."

          & $Tailscale up `
              --authkey="$env:TAILSCALE_AUTH_KEY" `
              --hostname="github-rdp" `
              --accept-dns=true

          if ($LASTEXITCODE -ne 0) {
              throw "Nao foi possivel conectar ao Tailscale."
          }

          Write-Host "[OK] Tailscale conectado."

          Write-Host ""
          Write-Host "============================================================"

      # ============================================================
      # 5. MOSTRAR IP E CREDENCIAIS
      # ============================================================

      - name: "05 - Mostrar dados de acesso"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $Tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $Tailscale)) {
              $Tailscale = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    RDP PRONTO"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "IP TAILSCALE:"
          Write-Host ""

          $IP = & $Tailscale ip -4

          if ([string]::IsNullOrWhiteSpace($IP)) {
              throw "Nao foi possivel obter o IP Tailscale."
          }

          Write-Host "  $IP"

          Write-Host ""
          Write-Host "CREDENCIAIS:"
          Write-Host ""
          Write-Host "  Usuario : RDPUser"
          Write-Host "  Senha   : Rdp@2026!Windows"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host " Use o IP acima no cliente de Area de Trabalho Remota."
          Write-Host "============================================================"
          Write-Host ""

      # ============================================================
      # 6. MANTER O RDP ATIVO
      # ============================================================

      - name: "06 - Manter RDP ativo"
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 RDP ONLINE"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Usuario : RDPUser"
          Write-Host "Senha   : Rdp@2026!Windows"
          Write-Host ""
          Write-Host "O workflow permanecera ativo enquanto o runner estiver ativo."
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""

          while ($true) {

              $Time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

              $RDPService = Get-Service `
                  -Name "TermService" `
                  -ErrorAction SilentlyContinue

              if ($RDPService -and $RDPService.Status -eq "Running") {
                  Write-Host "[$Time] [ONLINE] RDP funcionando."
              }
              else {
                  Write-Host "[$Time] [AVISO] Servico RDP nao esta rodando."

                  try {
                      Start-Service `
                          -Name "TermService" `
                          -ErrorAction SilentlyContinue

                      Write-Host "[$Time] [OK] Tentativa de reiniciar RDP realizada."
                  }
                  catch {
                      Write-Host "[$Time] [ERRO] Falha ao reiniciar RDP."
                  }
              }

              Start-Sleep -Seconds 60
          }
