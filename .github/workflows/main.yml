name: Skyro RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      RDP_USER: RDPUser
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

    steps:

      # ============================================================
      # CONFIGURAR RDP
      # ============================================================
      - name: Configurar RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configurando RDP..."

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "O Secret RDP_PASSWORD nao foi configurado."
          }

          # ==========================================================
          # CRIAR USUARIO COM SENHA TEMPORARIA FORTE
          # ==========================================================

          $temporaryPassword = ConvertTo-SecureString `
            "SkyroTemp@2026!" `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name $env:RDP_USER `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {

              Write-Host "Criando usuario com senha temporaria..."

              New-LocalUser `
                -Name $env:RDP_USER `
                -Password $temporaryPassword `
                -FullName "Skyro RDP" `
                -Description "Skyro RDP User" `
                -PasswordNeverExpires `
                -AccountNeverExpires

              Write-Host "Usuario criado."
          }
          else {

              Write-Host "Usuario ja existe."
          }

          # ==========================================================
          # DESABILITAR COMPLEXIDADE
          # ==========================================================

          Write-Host "Desabilitando complexidade de senha..."

          $policy = "$env:TEMP\skyro-policy.inf"

          secedit /export /cfg "$policy" /quiet

          if (-not (Test-Path $policy)) {
              throw "Nao foi possivel exportar a politica de seguranca."
          }

          $content = Get-Content "$policy" -Raw

          if ($content -match 'PasswordComplexity\s*=') {
              $content = $content -replace `
                'PasswordComplexity\s*=\s*\d+', `
                'PasswordComplexity = 0'
          }
          else {
              $content += "`r`nPasswordComplexity = 0`r`n"
          }

          if ($content -match 'MinimumPasswordLength\s*=') {
              $content = $content -replace `
                'MinimumPasswordLength\s*=\s*\d+', `
                'MinimumPasswordLength = 5'
          }
          else {
              $content += "`r`nMinimumPasswordLength = 5`r`n"
          }

          Set-Content `
            "$policy" `
            $content `
            -Encoding Unicode

          secedit /configure `
            /db "$env:TEMP\skyro.sdb" `
            /cfg "$policy" `
            /areas SECURITYPOLICY `
            /quiet

          Start-Sleep -Seconds 5

          net accounts /minpwlen:5 | Out-Null

          Start-Sleep -Seconds 3

          # ==========================================================
          # DEFINIR SENHA DO SECRET
          # ==========================================================

          Write-Host "Definindo senha do Secret RDP_PASSWORD..."

          $finalPassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          Set-LocalUser `
            -Name $env:RDP_USER `
            -Password $finalPassword

          Write-Host "Senha definida com sucesso."

          # ==========================================================
          # GRUPOS
          # ==========================================================

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USER `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USER `
            -ErrorAction SilentlyContinue

          # ==========================================================
          # ATIVAR RDP
          # ==========================================================

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0

          # ==========================================================
          # FIREWALL
          # ==========================================================

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          # ==========================================================
          # SERVICO
          # ==========================================================

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService"

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "================================"
          Write-Host "RDP CONFIGURADO"
          Write-Host "Usuario: $env:RDP_USER"
          Write-Host "Senha definida pelo Secret"
          Write-Host "================================"
          Write-Host ""
          
      # ============================================================
      # TAILSCALE
      # ============================================================
      - name: Conectar Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest


      # ============================================================
      # OBTER IP
      # ============================================================
      - name: Obter IP do Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Obtendo IP do Tailscale..."

          $ip = $null

          for ($i = 1; $i -le 15; $i++) {

              $ip = (tailscale ip -4 | Select-Object -First 1).Trim()

              if (-not [string]::IsNullOrWhiteSpace($ip)) {
                  break
              }

              Start-Sleep -Seconds 2
          }

          if ([string]::IsNullOrWhiteSpace($ip)) {
              throw "Nao foi possivel obter o IP do Tailscale."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "============================================"
          Write-Host "          SKYRO RDP ONLINE"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Tailscale IP : $ip"
          Write-Host "RDP IP       : $ip"
          Write-Host "RDP Porta    : 3389"
          Write-Host "Usuario      : $env:RDP_USER"
          Write-Host "Senha        : $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "============================================"
          Write-Host ""


      # ============================================================
      # TESTAR RDP
      # ============================================================
      - name: Testar RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Testando servico RDP..."

          $service = Get-Service `
            -Name "TermService" `
            -ErrorAction Stop

          if ($service.Status -ne "Running") {

              Start-Service `
                -Name "TermService"

              Start-Sleep -Seconds 2
          }

          Write-Host "TermService: $((Get-Service TermService).Status)"

          Write-Host ""
          Write-Host "Testando porta 3389..."

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
              throw "A porta 3389 nao esta acessivel."
          }

          Write-Host "Porta 3389: OK"


      # ============================================================
      # DISCORD WEBHOOK
      # ============================================================
      - name: Enviar acesso para Discord
        shell: powershell
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
              Write-Host "DISCORD_WEBHOOK_URL nao configurado."
              exit 0
          }

          $payload = @{
              username = "Skyro RDP"
              content = @"
          **SKYRO RDP ONLINE**

          IP Tailscale: ``$env:TAILSCALE_IP``
          Porta: ``3389``
          Usuario: ``$env:RDP_USER``
          Senha: ``$env:RDP_PASSWORD``

          Conecte pelo:
          ``mstsc``
          "@
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri $env:DISCORD_WEBHOOK_URL `
            -Method Post `
            -ContentType "application/json" `
            -Body $payload

          Write-Host "Webhook enviado."


      # ============================================================
      # MOSTRAR ACESSO
      # ============================================================
      - name: Mostrar acesso
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "================================================"
          Write-Host "              SKYRO RDP ONLINE"
          Write-Host "================================================"
          Write-Host ""
          Write-Host "IP TAILSCALE:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "PORTA:"
          Write-Host "3389"
          Write-Host ""
          Write-Host "USUARIO:"
          Write-Host "$env:RDP_USER"
          Write-Host ""
          Write-Host "SENHA:"
          Write-Host "$env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "================================================"
          Write-Host ""


      # ============================================================
      # MANTER VM ONLINE
      # ============================================================
      - name: Manter VM online
        shell: powershell
        run: |

          Write-Host "VM online."

          while ($true) {

              $rdp = Get-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              if ($null -eq $rdp) {

                  Write-Host "TermService nao encontrado."

              }
              elseif ($rdp.Status -ne "Running") {

                  Write-Host "RDP parado. Reiniciando..."

                  Start-Service `
                    -Name "TermService" `
                    -ErrorAction SilentlyContinue
              }

              Start-Sleep -Seconds 60
          }
